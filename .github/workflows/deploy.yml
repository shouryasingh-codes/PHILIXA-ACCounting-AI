name: Deploy Philixa 6.0 to Azure VM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-ci.txt

      - name: Verify Python syntax across app and scripts
        run: python3 -m compileall -q app scripts

      - name: Run frontend UI controller tests
        run: |
          set -euo pipefail
          for f in scripts/test_*.cjs; do
            echo "=== $f ==="
            node "$f"
          done

      - name: Run pytest suite
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
        run: python3 -m pytest tests/ -q --tb=short

      - name: Run offline accounting, GST, and MCP unit tests
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test
        run: |
          set -euo pipefail
          if [ -d data/day5-native ]; then
            python3 scripts/test_gst_native_exports.py
          fi
          python3 -m pytest scripts/test_task_agent_model.py scripts/test_task_agent_prompts.py scripts/test_task_agent_runtime.py scripts/test_intent_router_model.py scripts/test_routing_pilot_gate.py -q --tb=short
          python3 scripts/test_mcp_write_validation.py
          python3 scripts/test_repeat_purchase.py
          python3 scripts/test_tally_suppliers.py
          python3 -m unittest scripts.test_gst_purchase.Arithmetic scripts.test_gst_purchase.NativeShape scripts.test_multi_purchase.MultiProtocol -v

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ~/philixa
            git pull --ff-only origin main

            df -h /
            sudo docker image prune -f
            sudo docker builder prune -f --filter "until=24h"
            AVAIL_KB=$(df --output=avail / | tail -1 | tr -d ' ')
            if [ "${AVAIL_KB:-0}" -lt 6291456 ]; then
              sudo docker container prune -f
              sudo docker builder prune -af
            fi
            df -h /

            sudo docker compose -f docker-compose.prod.yml build app
            sudo docker compose -f docker-compose.prod.yml up -d

            sudo iptables -t nat -C PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8000 2>/dev/null || \
              sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8000

            curl --retry 15 --retry-delay 2 --retry-all-errors -sf http://127.0.0.1:8000/health
            echo ""
            sudo docker image prune -f
            sudo docker builder prune -f --keep-storage=4GB || sudo docker builder prune -f --filter "until=168h" || true
