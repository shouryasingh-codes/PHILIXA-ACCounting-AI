name: Deploy to Azure VM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd ~/philixa
            git pull origin main
            
            # Cleanly stop existing containers to avoid the ContainerConfig recreation bug
            sudo docker-compose down
            # Rebuild images if needed and restart all containers
            sudo docker-compose up -d --build
            
            # Ensure the iptables port routing is active
            sudo iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 8000 || true


