# Explicit opt-in candidate. No host port; one worker, bounded CPU/RAM.
services:
  layout-reader:
    build:
      context: .
      dockerfile: layout_reader/Dockerfile
    image: philixa-layout-reader:ppstructure-3.3.2
    profiles: [layout-review]
    environment:
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/reader:size=64m,uid=10001,gid=10001
    networks: [layout-private]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  document-worker:
    environment:
      PHILIXA_LAYOUT_READER_URL: http://layout-reader:8097
      PHILIXA_LAYOUT_REVIEW_ENABLED: ${PHILIXA_LAYOUT_REVIEW_ENABLED:-0}
    networks: [default, layout-private]
  app:
    environment:
      PHILIXA_LAYOUT_READER_URL: http://layout-reader:8097
      PHILIXA_LAYOUT_REVIEW_ENABLED: ${PHILIXA_LAYOUT_REVIEW_ENABLED:-0}
    networks: [default, layout-private]
networks:
  layout-private:
    internal: true
