name: accounts-dev

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-philixa}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9100:9000"
      - "127.0.0.1:9101:9001"
    # Fixed credentials are intentionally for local development only.
    # Use a secret-managed configuration for any shared or production deployment.
    environment:
      MINIO_ROOT_USER: ${PHILIXA_MINIO_ACCESS_KEY:-philixa_minio}
      MINIO_ROOT_PASSWORD: ${PHILIXA_MINIO_SECRET_KEY:-philixa_secret}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    ports:
      - "127.0.0.1:8001:8000"

    env_file:
      - .env
    environment:
      - PHILIXA_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-philixa}
      - PHILIXA_REDIS_URL=redis://redis:6379/0
      - PHILIXA_MINIO_URL=minio:9000
      - PYTHONUTF8=1
      - WATCHFILES_FORCE_POLLING=true
      - PHILIXA_PURCHASE_REPORT_ENABLED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - hf_cache:/root/.cache/huggingface
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"

  worker:
    build: .
    env_file:
      - .env
    environment:
      - PHILIXA_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-philixa}
      - PHILIXA_REDIS_URL=redis://redis:6379/0
      - PHILIXA_MINIO_URL=minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./scripts:/app/scripts
      - hf_cache:/root/.cache/huggingface
    command: >
      sh -c "arq app.worker.WorkerSettings"

  document-worker:
    image: accounts-dev-app
    env_file:
      - .env
    environment:
      - PHILIXA_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-philixa}
      - PHILIXA_REDIS_URL=redis://redis:6379/0
      - PHILIXA_MINIO_URL=minio:9000
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: arq app.jobs.document_jobs.DocumentWorkerSettings

  tally-worker:
    build: .
    env_file:
      - .env
    environment:
      - PHILIXA_DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-philixa}
      - PHILIXA_REDIS_URL=redis://redis:6379/0
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./data:/app/data
    command: arq app.tally_worker.WorkerSettings

volumes:
  pgdata:
  redisdata:
  miniodata:
  hf_cache:
